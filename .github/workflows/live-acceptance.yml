name: Live exchange acceptance

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketdata-live-acceptance
  cancel-in-progress: false

jobs:
  binance-bybit-rest-ws:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out OpenPine Contracts candidate
        uses: actions/checkout@v4
        with:
          repository: s7cret/openpine-contracts
          ref: db1745756516b47466756c9c5d38fbbb95595a3b
          path: openpine-contracts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify supported CPython and GIL
        run: |
          python - <<'PY'
          import platform
          import sys
          import sysconfig
          assert sys.version_info[:2] == (3, 13), sys.version
          assert platform.python_implementation() == "CPython"
          assert not sysconfig.get_config_var("Py_GIL_DISABLED"), "free-threaded builds are unsupported"
          assert sys._is_gil_enabled(), "GIL must be enabled"
          PY
      - name: Install live acceptance dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./openpine-contracts
          python -m pip install -e ".[dev,stream]"

      - name: Probe Binance and Bybit REST and WebSocket
        run: |
          mkdir -p artifacts
          timeout 330s python -m marketdata_provider.acceptance --mode live --timeout 15 --json artifacts/live-acceptance.json

      - name: Probe canonical create_provider Binance spot SOLUSDT 1m
        run: timeout 120s python -m pytest -q -m live_network tests/test_real_data_acceptance.py::test_public_create_provider_binance_spot_solusdt_1m

      - name: Upload classified acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-acceptance-report
          path: artifacts/live-acceptance.json
          if-no-files-found: error
          retention-days: 14
