name: CI

on:
  push:
    branches: [main, release/5.0.0rc6]
  pull_request:
    branches: [main, release/5.0.0rc6]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD HEAD^{tree}

      - name: Check out OpenPine Contracts candidate
        uses: actions/checkout@v4
        with:
          repository: s7cret/openpine-contracts
          ref: db1745756516b47466756c9c5d38fbbb95595a3b
          path: openpine-contracts

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Verify supported CPython and GIL
        run: |
          python - <<'PY'
          import platform
          import sys
          import sysconfig
          assert sys.version_info[:2] == (3, 13), sys.version
          assert platform.python_implementation() == "CPython"
          assert not sysconfig.get_config_var("Py_GIL_DISABLED"), "free-threaded builds are unsupported"
          assert sys._is_gil_enabled(), "GIL must be enabled"
          PY
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./openpine-contracts
          python -m pip install -e ".[dev,stream,parquet,zstd]"

      - name: Run tests
        run: python -m pytest -q -m "not live_network"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Check Black formatting
        run: python -m black --check marketdata_provider tests scripts

      - name: Run mypy
        run: python -m mypy

      - name: Run release gate
        env:
          PYTHON: python
        run: bash scripts/release_gate.sh
