name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out OpenPine Contracts candidate
        uses: actions/checkout@v4
        with:
          repository: s7cret/openpine-contracts
          ref: cd1f7c3eb8af9026ca8fa53c614586a48749419d
          path: openpine-contracts

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./openpine-contracts
          python -m pip install -e ".[dev,stream]"

      - name: Run tests
        run: python -m pytest -q -m "not live_network"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Check Black formatting
        run: python -m black --check marketdata_provider tests scripts

      - name: Run mypy
        run: python -m mypy

      - name: Run release gate
        env:
          PYTHON: python
        run: bash scripts/release_gate.sh
