name: Reviewed RC6 verification and publication
on:
  push:
    branches: ['ops/rc6-review-publication-*']
    paths: ['.github/maintenance/reviewed-series.json', '.github/workflows/reviewed-publication.yml']
permissions:
  contents: read
concurrency:
  group: reviewed-rc6-${{ github.repository }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          repository: s7cret/pinelib
          ref: 931252f637c86b3ffe872ceb4a4cda4453eb7da2
          sparse-checkout: .github/maintenance/reviewed-publisher.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: cp .github/maintenance/reviewed-publisher.py "$RUNNER_TEMP/reviewed-publisher.py"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: ''
      - run: git sparse-checkout disable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install verification dependencies
        run: >-
          python -m pip install pytest==9.1.1 pytest-cov==7.1.0 tzdata==2026.2
          jsonschema==4.26.0 setuptools==84.0.0 wheel==0.48.0 hatchling==1.32.0
          build==1.6.0 httpx==0.28.1 typing-extensions==4.16.0
          pyarrow==25.0.1 pandas==3.0.5 websockets==16.0 socksio==1.0.0
          zstandard==0.25.0
      - name: Reconstruct exact reviewed commits
        run: python "$RUNNER_TEMP/reviewed-publisher.py" reconstruct "$RUNNER_TEMP/review-evidence" .github/maintenance/reviewed-series.json
      - name: Install a clean copy without contaminating the test source
        run: |
          mkdir -p "$RUNNER_TEMP/build-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/build-source"
          python -m pip install --no-deps --no-build-isolation "$RUNNER_TEMP/build-source"
      - name: Run all offline functional tests
        run: python -m pytest -q --no-cov -m 'not live_network' --junitxml="$RUNNER_TEMP/review-evidence/pytest.xml"
      - name: Build distribution and preserve environment
        run: |
          python -m build --no-isolation --outdir "$RUNNER_TEMP/review-evidence/dist" "$RUNNER_TEMP/build-source"
          python -m pip freeze > "$RUNNER_TEMP/review-evidence/environment.txt"
          cp "$RUNNER_TEMP/reviewed-publisher.py" "$RUNNER_TEMP/review-evidence/reviewed-publisher.py"
          git status --porcelain > "$RUNNER_TEMP/review-evidence/post-test-worktree.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-${{ matrix.python }}-${{ github.run_id }}
          path: ${{ runner.temp }}/review-evidence/
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-3.13-${{ github.run_id }}
          path: evidence
      - run: python evidence/reviewed-publisher.py publish evidence
