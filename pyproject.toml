[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketdata-provider"
version = "4.0.1"
description = "Market data provider for normalized exchange OHLCV and cache workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.25",
  "tomli>=2; python_version < '3.11'",
  "typing-extensions>=4.0",
]
license = {text = "MIT"}

[project.urls]
Homepage = "https://github.com/s7cret/marketdata-provider"
Repository = "https://github.com/s7cret/marketdata-provider"
Issues = "https://github.com/s7cret/marketdata-provider/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=6", "mypy>=1.8", "ruff", "black>=24"]
parquet = ["pyarrow>=14"]
stream = ["websockets>=12", "socksio>=1.0,<2"]
zstd = ["zstandard>=0.22"]

[project.scripts]
marketdata = "marketdata_provider.cli.main:main"

[tool.setuptools.packages.find]
include = ["marketdata_provider*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "live_network: requires unrestricted external exchange REST/WebSocket access",
]

[tool.mypy]
python_version = "3.10"
packages = ["marketdata_provider"]
disallow_untyped_defs = false
warn_unused_ignores = true
ignore_missing_imports = true

[tool.ruff.lint]
# Acceptance, adapter, and storage boundaries deliberately convert broad
# failures into deterministic diagnostics or recovery outcomes.
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
# Compatibility modules intentionally re-export the stable public surface.
"marketdata_provider/core/timeframes.py" = ["F403"]
"marketdata_provider/core/validation.py" = ["F403"]
# These tests intentionally model process death below Exception.
"tests/test_incremental_append.py" = ["TRY002"]
# Shared mutable fakes model cross-instance HTTP/discovery state.
"tests/test_multi_exchange_spot_adapters.py" = ["RUF012"]
"tests/test_public_spot_adapter.py" = ["RUF012"]
"tests/test_symbol_discovery.py" = ["RUF012"]

[tool.coverage.run]
source = ["marketdata_provider"]

[tool.coverage.report]
fail_under = 100
show_missing = true
