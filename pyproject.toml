[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketdata-provider"
version = "4.0.0"
description = "Market data provider for normalized exchange OHLCV and cache workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.25", "tomli>=2; python_version < '3.11'"]
license = {text = "MIT"}

[project.urls]
Homepage = "https://github.com/s7cret/marketdata-provider"
Repository = "https://github.com/s7cret/marketdata-provider"
Issues = "https://github.com/s7cret/marketdata-provider/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=6", "mypy>=1.8", "ruff", "black>=24"]
parquet = ["pyarrow>=14"]
stream = ["websockets>=12"]
zstd = ["zstandard>=0.22"]

[project.scripts]
marketdata = "marketdata_provider.cli.main:main"

[tool.setuptools.packages.find]
include = ["marketdata_provider*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "live_network: requires unrestricted external exchange REST/WebSocket access",
]

[tool.mypy]
python_version = "3.10"
packages = ["marketdata_provider"]
disallow_untyped_defs = false
warn_unused_ignores = true
ignore_missing_imports = true


[tool.coverage.run]
source = ["marketdata_provider"]

[tool.coverage.report]
fail_under = 100
show_missing = true
